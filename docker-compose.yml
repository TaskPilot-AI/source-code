services:
  agents-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    container_name: agents-service-app
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    networks:
      - app-network

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_KEY=${API_KEY}
      - DATABASE_URL=postgresql://task_pilot_db_user:task_pilot_db_password@task-pilot-db:5432/task_pilot_db
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-super-secret-better-auth-key-32charsmin}
      - BETTER_AUTH_URL=http://localhost:3000
      - INTERNAL_API_URL=http://backend:8000/api/v1
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      task-pilot-db:
        condition: service_healthy
    networks:
      - app-network
  
  nexus:
    build: 
      context: ./nexus
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - INTERNAL_API_URL=http://backend:8000/api/v1
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    networks:
      - app-network
  
  task-pilot-db:
    image: postgres:15-alpine
    container_name: task-pilot-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: task_pilot_db
      POSTGRES_USER: task_pilot_db_user
      POSTGRES_PASSWORD: task_pilot_db_password
    volumes:
      - task-pilot-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_pilot_db_user -d task_pilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://task_pilot_db_user:task_pilot_db_password@task-pilot-db:5432/task_pilot_db
      - API_KEY=${API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - SEARCH_API_BASE=${SEARCH_API_BASE}
      - SEARXNG_API_BASE=${SEARXNG_API_BASE}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - AGENT_SERVICE_URL=http://agents-service:5000/
    depends_on:
      task-pilot-db:
        condition: service_healthy
      agents-service:
        condition: service_started
    entrypoint: ["sh", "-c", "bunx prisma db push && bun run dev"]
    networks:
      - app-network

  caddy:
    container_name: caddy
    image: docker.io/library/caddy:2-alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./searxng-docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data:rw
      - caddy-config:/config:rw
    environment:
      - SEARXNG_HOSTNAME=${SEARXNG_HOSTNAME:-http://localhost}
      - SEARXNG_TLS=${LETSENCRYPT_EMAIL:-internal}
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  redis:
    container_name: redis
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks:
      - searxng
    volumes:
      - valkey-data2:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    networks:
      - searxng
    # ports:
    #   - "8080:8080"
    volumes:
      - ./searxng-docker/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=https://${SEARXNG_HOSTNAME:-localhost}/
      - UWSGI_WORKERS=${SEARXNG_UWSGI_WORKERS:-4}
      - UWSGI_THREADS=${SEARXNG_UWSGI_THREADS:-4}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  searxng:
    driver: bridge
  app-network:
    driver: bridge
    
volumes:
  caddy-data:
  caddy-config:
  valkey-data2:
  task-pilot-db-data: